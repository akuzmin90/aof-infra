{{- $image := "" -}}
{{- if .Values.image.digest -}}
{{- $image = printf "%s@%s" .Values.image.repository .Values.image.digest -}}
{{- else -}}
{{- $image = printf "%s:%s" .Values.image.repository (required "Set image.tag or image.digest to the reviewed VPN image" .Values.image.tag) -}}
{{- end }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ .Release.Name }}
  labels:
    app.kubernetes.io/name: aof-agent-vpn
    app.kubernetes.io/instance: {{ .Release.Name }}
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/instance: {{ .Release.Name }}
  template:
    metadata:
      labels:
        app.kubernetes.io/name: aof-agent-vpn
        app.kubernetes.io/instance: {{ .Release.Name }}
    spec:
      automountServiceAccountToken: false
      enableServiceLinks: false
      terminationGracePeriodSeconds: 30
      dnsPolicy: None
      dnsConfig:
        nameservers: {{ .Values.dnsServers | toJson }}
      securityContext:
        seccompProfile:
          type: RuntimeDefault
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      containers:
        - name: vpn
          image: {{ $image | quote }}
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          args: [run]
          env:
            - name: AUTO_COUNTRY_FAILOVER
              value: {{ ternary "1" "0" .Values.failover.enabled | quote }}
            - name: PROBE_URLS
              value: {{ join "," .Values.probeUrls | quote }}
          securityContext:
            runAsUser: 0
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: [ALL]
              add: [NET_ADMIN]
          resources:
            {{- toYaml .Values.resources.vpn | nindent 12 }}
          startupProbe:
            exec:
              command: [python3, /app/vpn.py, live]
            periodSeconds: 5
            failureThreshold: 12
          readinessProbe:
            exec:
              command: [python3, /app/vpn.py, ready]
            periodSeconds: 5
            timeoutSeconds: 3
          # External failures trigger the supervisor's backoff/failover, not a restart loop.
          livenessProbe:
            exec:
              command: [python3, /app/vpn.py, live]
            periodSeconds: 15
            timeoutSeconds: 3
            failureThreshold: 3
          volumeMounts:
            - name: config
              mountPath: /config
              readOnly: true
            - name: tun
              mountPath: /dev/net/tun
            - name: runtime
              mountPath: /run
            - name: status
              mountPath: /status
        - name: proxy
          image: {{ $image | quote }}
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          command: [python3, /app/proxy.py]
          env:
            - name: PROXY_HOSTS
              value: {{ join "," .Values.proxyHosts | quote }}
          ports:
            - name: proxy
              containerPort: 8888
            - name: health
              containerPort: 8889
          securityContext:
            runAsUser: 65532
            runAsGroup: 65532
            runAsNonRoot: true
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: [ALL]
          resources:
            {{- toYaml .Values.resources.proxy | nindent 12 }}
          readinessProbe:
            tcpSocket:
              port: proxy
            periodSeconds: 5
          volumeMounts:
            - name: status
              mountPath: /status
              readOnly: true
      volumes:
        - name: config
          secret:
            secretName: {{ .Values.secretName | quote }}
            defaultMode: 0400
        - name: tun
          hostPath:
            path: /dev/net/tun
            type: CharDevice
        - name: runtime
          emptyDir:
            medium: Memory
            sizeLimit: 8Mi
        - name: status
          emptyDir:
            medium: Memory
            sizeLimit: 1Mi
