{{- range $role := list "controller" "executor" }}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ $.Release.Name }}-{{ $role }}
spec:
  # The old controller stays scaled down during the transition. One worker owns the queue.
  replicas: {{ ternary 1 0 (and $.Values.enabled (eq $role "executor")) }}
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/instance: {{ $.Release.Name }}
      app.kubernetes.io/component: {{ $role }}
  template:
    metadata:
      labels:
        app.kubernetes.io/instance: {{ $.Release.Name }}
        app.kubernetes.io/component: {{ $role }}
        app.kubernetes.io/part-of: aof-agent
    spec:
      automountServiceAccountToken: false
      serviceAccountName: aof-agent-telegram-developer
      imagePullSecrets:
        {{- toYaml $.Values.imagePullSecrets | nindent 8 }}
      affinity:
        podAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            - topologyKey: kubernetes.io/hostname
              labelSelector:
                matchLabels:
                  aof-agent/workspace: "true"
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        fsGroup: 10001
        fsGroupChangePolicy: OnRootMismatch
        seccompProfile:
          type: Unconfined
        appArmorProfile:
          type: Unconfined
      containers:
        - name: {{ $role }}
          image: {{ printf "%s@%s" $.Values.image.repository (required "image.digest required" $.Values.image.digest) | quote }}
          command: [python3, -m, worker.background]
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: [ALL]
          env:
            - name: AOF_DATABASE_DSN_FILE
              value: /run/secrets/database/uri
            - name: AOF_DATABASE_CA_FILE
              value: /run/secrets/database/ca.crt
            - name: HTTPS_PROXY
              value: {{ $.Values.proxyUrl | quote }}
            - name: HTTP_PROXY
              value: {{ $.Values.proxyUrl | quote }}
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              cpu: "1500m"
              memory: 3Gi
          readinessProbe:
            exec:
              command: [python3, -c, "import os,time; raise SystemExit(time.time()-os.stat('/tmp/executor-ready').st_mtime > 180)"]
            initialDelaySeconds: 5
            periodSeconds: 15
          volumeMounts:
            - name: workspace
              mountPath: /workspace
            - name: state
              mountPath: /state
            - name: transport
              mountPath: /transport
            - name: database
              mountPath: /run/secrets/database
              readOnly: true
            - name: github
              mountPath: /run/secrets/github
              readOnly: true
            - name: jira
              mountPath: /run/secrets/jira
              readOnly: true
            - name: kubernetes
              mountPath: /run/secrets/kubernetes
              readOnly: true
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: workspace
          persistentVolumeClaim:
            claimName: {{ $.Values.workspaceClaim }}
        - name: state
          persistentVolumeClaim:
            claimName: {{ $.Values.stateClaim }}
        - name: transport
          persistentVolumeClaim:
            claimName: aof-agent-telegram
        - name: github
          secret:
            secretName: {{ $.Values.githubSecret }}
            defaultMode: 0440
        - name: jira
          secret:
            secretName: aof-agent-jira
            defaultMode: 0440
        - name: database
          projected:
            defaultMode: 0440
            sources:
              - secret:
                  name: {{ $.Values.database.appSecret }}
                  items:
                    - key: uri
                      path: uri
              - secret:
                  name: {{ $.Values.database.caSecret }}
                  items:
                    - key: ca.crt
                      path: ca.crt
        - name: kubernetes
          projected:
            defaultMode: 0440
            sources:
              - serviceAccountToken:
                  path: token
                  expirationSeconds: 3600
              - configMap:
                  name: kube-root-ca.crt
                  items:
                    - key: ca.crt
                      path: ca.crt
        - name: tmp
          emptyDir:
            sizeLimit: 512Mi
{{- end }}
