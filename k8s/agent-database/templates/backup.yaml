{{- if .Values.backup.enabled }}
apiVersion: postgresql.cnpg.io/v1
kind: ScheduledBackup
metadata:
  name: {{ .Release.Name }}-daily
spec:
  schedule: {{ .Values.backup.schedule | quote }}
  backupOwnerReference: self
  immediate: false
  method: barmanObjectStore
  cluster:
    name: {{ .Release.Name }}
{{- end }}
