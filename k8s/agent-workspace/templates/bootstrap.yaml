apiVersion: batch/v1
kind: Job
metadata:
  name: {{ .Values.bootstrap.jobName }}
spec:
  backoffLimit: 0
  activeDeadlineSeconds: 2400
  ttlSecondsAfterFinished: 86400
  template:
    metadata:
      labels:
        app.kubernetes.io/name: aof-agent-repositories
        app.kubernetes.io/instance: {{ .Release.Name }}
    spec:
      restartPolicy: Never
      automountServiceAccountToken: false
      imagePullSecrets:
        {{- toYaml .Values.imagePullSecrets | nindent 8 }}
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        fsGroup: 10001
        fsGroupChangePolicy: OnRootMismatch
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: repositories
          image: {{ .Values.bootstrap.image | quote }}
          command: [python3, /opt/repositories/bootstrap.py]
          workingDir: /workspace
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: [ALL]
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
              ephemeral-storage: 64Mi
            limits:
              cpu: "1"
              memory: 1Gi
              ephemeral-storage: 128Mi
          volumeMounts:
            - name: workspace
              mountPath: /workspace
            - name: github
              mountPath: /run/secrets/github
              readOnly: true
            - name: source
              mountPath: /opt/repositories
              readOnly: true
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: workspace
          persistentVolumeClaim:
            claimName: {{ .Release.Name }}
        - name: github
          secret:
            secretName: {{ .Values.bootstrap.githubSecret }}
            defaultMode: 0440
        - name: source
          configMap:
            name: {{ .Values.bootstrap.sourceConfigMap }}
        - name: tmp
          emptyDir:
            sizeLimit: 64Mi
