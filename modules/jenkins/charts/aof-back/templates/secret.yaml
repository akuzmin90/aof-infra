{{- if not .Values.database.existingSecret }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "aof-back.databaseSecretName" . }}
  labels:
    {{- include "aof-back.labels" . | nindent 4 }}
type: Opaque
stringData:
  {{ .Values.database.usernameKey }}: {{ required "database.username is required when database.existingSecret is not set" .Values.database.username | quote }}
  {{ .Values.database.passwordKey }}: {{ required "database.password is required when database.existingSecret is not set" .Values.database.password | quote }}
{{- end }}
